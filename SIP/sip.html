<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SIP - MoneyVest</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="sip.css" />
</head>

<body>
  <header>
    <h1>📈 SIP</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="mutualfund.html">Mutual Fund</a></li>
        <li><a href="gold.html">Gold</a></li>
        <li><a href="silver.html">Silver</a></li>
        <li><a href="stocks.html">Stocks</a></li>
        <li><a href="expense.html">Expense</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="charts">
      <h2>SIP Overview</h2>
      <p>Welcome to the SIP section. Manage your Systematic Investment Plans here and track their performance.</p>

      <div class="calculator" aria-label="SIP Calculator">
        <h3>SIP Calculator</h3>
        <label for="monthlyInvestment">Monthly Investment Amount (₹):</label>
        <input type="number" id="monthlyInvestment" placeholder="e.g. 5000" min="1" />

        <label for="annualReturn">Expected Annual Return Rate (%):</label>
        <input type="number" id="annualReturn" placeholder="e.g. 12" min="0" step="0.1" />

        <label for="investmentDuration">Investment Duration (years):</label>
        <input type="number" id="investmentDuration" placeholder="e.g. 10" min="1" />

        <button id="calculateBtn">Calculate</button>

        <div id="result" class="result" style="display:none;"></div>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2025 MoneyVest. All rights reserved.</p>
  </footer>

  <script src="sip.js"></script>
</body>

</html>
