<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gold Tracker - MoneyVest</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="gold.css" />
</head>

<body>
  <header>
    <h1>🥇 Gold Tracker</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="sip.html">SIP</a></li>
        <li><a href="mutualfund.html">Mutual Fund</a></li>
        <li><a href="silver.html">Silver</a></li>
        <li><a href="stocks.html">Stocks</a></li>
        <li><a href="expense.html">Expense</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="gold-section">
      <h2>Add Your Gold Holdings</h2>
      <form id="goldForm" aria-label="Add Gold Holdings Form">
        <label for="goldWeight">Weight (grams):</label>
        <input type="number" id="goldWeight" min="0.01" step="0.01" placeholder="e.g. 10.5" required />

        <label for="goldPrice">Price per gram (₹):</label>
        <input type="number" id="goldPrice" min="0" step="0.01" placeholder="e.g. 5600" required />

        <button type="submit">Add Holding</button>
      </form>

      <h2>Gold Holdings</h2>
      <ul id="goldList" aria-live="polite" aria-label="List of Gold Holdings"></ul>

      <div class="total-value">
        <h3>Total Gold Value: ₹<span id="totalValue">0.00</span></h3>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2025 MoneyVest. All rights reserved.</p>
  </footer>

  <script src="gold.js"></script>
</body>

</html>
