<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Silver Tracker - MoneyVest</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="silver.css" />
</head>

<body>
  <header>
    <h1>⚪ Silver Tracker</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="sip.html">SIP</a></li>
        <li><a href="mutualfund.html">Mutual Fund</a></li>
        <li><a href="gold.html">Gold</a></li>
        <li><a href="stocks.html">Stocks</a></li>
        <li><a href="expense.html">Expense</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="silver-section">
      <h2>Add Your Silver Holdings</h2>
      <form id="silverForm" aria-label="Add Silver Holdings Form">
        <label for="silverWeight">Weight (grams):</label>
        <input type="number" id="silverWeight" min="0.01" step="0.01" placeholder="e.g. 50" required />

        <label for="silverPrice">Price per gram (₹):</label>
        <input type="number" id="silverPrice" min="0" step="0.01" placeholder="e.g. 65" required />

        <button type="submit">Add Holding</button>
      </form>

      <h2>Silver Holdings</h2>
      <ul id="silverList" aria-live="polite" aria-label="List of Silver Holdings"></ul>

      <div class="total-value">
        <h3>Total Silver Value: ₹<span id="silverTotalValue">0.00</span></h3>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2025 MoneyVest. All rights reserved.</p>
  </footer>

  <script src="silver.js"></script>
</body>

</html>
