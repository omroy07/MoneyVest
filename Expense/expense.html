<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expense Tracker - MoneyVest</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="expense.css" />
</head>

<body>
  <header>
    <h1>💸 Expense Tracker</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="sip.html">SIP</a></li>
        <li><a href="mutualfund.html">Mutual Fund</a></li>
        <li><a href="gold.html">Gold</a></li>
        <li><a href="silver.html">Silver</a></li>
        <li><a href="stocks.html">Stocks</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="expense-section">
      <h2>Add an Expense</h2>
      <form id="expenseForm" aria-label="Add Expense Form">
        <label for="expenseName">Expense Name:</label>
        <input type="text" id="expenseName" placeholder="e.g. Grocery" required />

        <label for="expenseAmount">Amount (₹):</label>
        <input type="number" id="expenseAmount" placeholder="e.g. 500" min="1" required />

        <label for="expenseDate">Date:</label>
        <input type="date" id="expenseDate" required />

        <button type="submit">Add Expense</button>
      </form>

      <h2>Expense List</h2>
      <ul id="expenseList" aria-live="polite" aria-label="List of Expenses"></ul>
    </section>
  </main>

  <footer>
    <p>© 2025 MoneyVest. All rights reserved.</p>
  </footer>

  <script src="expense.js"></script>
</body>

</html>
