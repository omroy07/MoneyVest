<!DOCTYPE html>
<html>
<head>
    <title>Silver Price Prediction</title>
    <meta charset="utf-8">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Silver particles background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, rgba(192,192,192,0.4), transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(169,169,169,0.3), transparent),
                radial-gradient(1px 1px at 90px 40px, rgba(211,211,211,0.5), transparent),
                radial-gradient(1px 1px at 130px 80px, rgba(192,192,192,0.3), transparent),
                radial-gradient(2px 2px at 160px 30px, rgba(169,169,169,0.4), transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
            z-index: 1;
            pointer-events: none;
            animation: sparkle 8s linear infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.2),
                inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative;
            z-index: 2;
            border: 1px solid rgba(192,192,192,0.2);
        }

        .container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #c0c0c0, #a9a9a9, #d3d3d3, #c0c0c0);
            border-radius: 20px;
            z-index: -1;
            animation: borderShine 3s ease-in-out infinite alternate;
        }

        @keyframes borderShine {
            0% { opacity: 0.5; }
            100% { opacity: 0.8; }
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: 300;
            position: relative;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        h2::before {
            content: '🥈';
            margin-right: 15px;
            font-size: 0.8em;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.2));
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #c0c0c0, transparent);
            border-radius: 2px;
        }

        form {
            background: rgba(248, 249, 250, 0.8);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
            border: 1px solid rgba(192,192,192,0.1);
        }

        label {
            display: block;
            color: #495057;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.9);
        }

        input:focus {
            outline: none;
            border-color: #c0c0c0;
            box-shadow: 0 0 0 3px rgba(192,192,192,0.1);
            transform: translateY(-2px);
        }

        input:hover {
            border-color: #a9a9a9;
        }

        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #c0c0c0 0%, #a9a9a9 100%);
            color: #2c3e50;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(192,192,192,0.3);
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.6s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(192,192,192,0.4);
            background: linear-gradient(135deg, #d3d3d3 0%, #c0c0c0 100%);
        }

        button:active {
            transform: translateY(-1px);
        }

        table {
            width: 100%;
            margin-top: 30px;
            border-collapse: collapse;
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid rgba(192,192,192,0.2);
        }

        th {
            background: linear-gradient(135deg, #c0c0c0 0%, #a9a9a9 100%);
            color: #2c3e50;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 20px;
            position: relative;
        }

        th::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
        }

        td {
            padding: 18px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(192,192,192,0.1);
            font-size: 16px;
            color: #495057;
            transition: background-color 0.3s ease;
        }

        tbody tr:hover {
            background-color: rgba(192,192,192,0.05);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        canvas {
            margin-top: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid rgba(192,192,192,0.2);
            background: rgba(255,255,255,0.95);
        }

        /* Silver coin decoration */
        .silver-coin {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, #f5f5f5, #c0c0c0, #a9a9a9);
            border-radius: 50%;
            box-shadow: 
                inset 0 0 20px rgba(255,255,255,0.5),
                0 5px 15px rgba(0,0,0,0.2);
            opacity: 0.1;
        }

        .silver-coin-1 {
            top: 20px;
            right: 50px;
            animation: float 6s ease-in-out infinite;
        }

        .silver-coin-2 {
            bottom: 30px;
            left: 30px;
            animation: float 8s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        /* Loading animation */
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
            color: #c0c0c0;
            font-size: 18px;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #c0c0c0;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                margin: 10px;
                padding: 20px;
            }
            
            h2 {
                font-size: 2em;
            }
            
            input, button {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="silver-coin silver-coin-1"></div>
    <div class="silver-coin silver-coin-2"></div>
    
    <div class="container">
        <h2>Silver Price Prediction</h2>
        <form id="predictionForm">
            <label>💰 Current Price:</label>
            <input type="number" step="0.001" name="price" required placeholder="Enter current silver price">

            <label>📈 Open:</label>
            <input type="number" step="0.001" name="open" required placeholder="Opening price">

            <label>⬆️ High:</label>
            <input type="number" step="0.001" name="high" required placeholder="Highest price">

            <label>⬇️ Low:</label>
            <input type="number" step="0.001" name="low" required placeholder="Lowest price">

            <button type="submit">🔮 Predict Silver Price</button>
        </form>

        <div class="loading" id="loading">Analyzing silver market trends...</div>

        <table id="resultsTable" style="display:none;">
            <thead>
                <tr>
                    <th>📅 Date</th>
                    <th>💎 Predicted Price</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <canvas id="predictionChart" style="display:none;" height="100"></canvas>
    </div>

<script>
let chartInstance = null;

document.getElementById('predictionForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    // Show loading animation
    document.getElementById('loading').style.display = 'block';
    document.getElementById('resultsTable').style.display = 'none';
    document.getElementById('predictionChart').style.display = 'none';

    const formData = new FormData(this);

    fetch('/predict', {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        // Hide loading animation
        document.getElementById('loading').style.display = 'none';
        
        // Update Table
        const table = document.getElementById('resultsTable');
        const tbody = table.querySelector('tbody');
        tbody.innerHTML = '';

        const labels = [];
        const prices = [];

        data.forEach(row => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${row.date}</td><td>$${parseFloat(row.predicted_price).toFixed(3)}</td>`;
            tbody.appendChild(tr);

            labels.push(row.date);
            prices.push(row.predicted_price);
        });

        table.style.display = 'table';

        // Update Chart
        const ctx = document.getElementById('predictionChart').getContext('2d');
        document.getElementById('predictionChart').style.display = 'block';

        if (chartInstance) {
            chartInstance.destroy();
        }

        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Predicted Silver Price',
                    data: prices,
                    borderColor: '#c0c0c0',
                    backgroundColor: 'rgba(192,192,192,0.1)',
                    fill: true,
                    tension: 0.4,
                    pointRadius: 6,
                    pointBackgroundColor: '#a9a9a9',
                    pointBorderColor: '#ffffff',
                    pointBorderWidth: 2,
                    pointHoverRadius: 8,
                    borderWidth: 3
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        display: true,
                        labels: {
                            color: '#495057',
                            font: {
                                size: 14,
                                weight: '600'
                            }
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(192,192,192,0.95)',
                        titleColor: '#2c3e50',
                        bodyColor: '#2c3e50',
                        borderColor: '#a9a9a9',
                        borderWidth: 1,
                        cornerRadius: 8,
                        displayColors: false
                    }
                },
                scales: {
                    x: {
                        title: {
                            display: true,
                            text: '📅 Week',
                            color: '#495057',
                            font: {
                                size: 14,
                                weight: '600'
                            }
                        },
                        grid: {
                            color: 'rgba(192,192,192,0.2)'
                        },
                        ticks: {
                            color: '#495057'
                        }
                    },
                    y: {
                        title: {
                            display: true,
                            text: '💰 Price ($)',
                            color: '#495057',
                            font: {
                                size: 14,
                                weight: '600'
                            }
                        },
                        grid: {
                            color: 'rgba(192,192,192,0.2)'
                        },
                        ticks: {
                            color: '#495057',
                            callback: function(value) {
                                return '$' + value.toFixed(3);
                            }
                        }
                    }
                },
                elements: {
                    point: {
                        hoverBorderWidth: 3
                    }
                }
            }
        });
    })
    .catch(error => {
        console.error('Error:', error);
        document.getElementById('loading').style.display = 'none';
        alert('Error occurred while predicting silver prices. Please try again.');
    });
});
</script>
</body>
</html>
